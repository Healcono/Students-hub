        const Icon = ({ name, className }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (containerRef.current && window.lucide) {
                    // Create a temporary element to hold the icon
                    const temp = document.createElement('div');
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    if (className) i.setAttribute('class', className);
                    temp.appendChild(i);
                    
                    // Let Lucide process it
                    window.lucide.createIcons({
                        root: temp,
                        nameAttr: 'data-lucide'
                    });
                    
                    // Move the SVG to our container
                    containerRef.current.innerHTML = temp.innerHTML;
                }
            }, [name, className]);

            const [isActive, setIsActive] = useState(false);
            const [phase, setPhase] = useState('ready'); // 'ready', 'inhale', 'hold', 'exhale'
            
            // Animation loop logic
            useEffect(() => {
                let timer;
                if (isActive) {
                    // Start cycle
                    const runCycle = () => {
                        setPhase('inhale');
                        timer = setTimeout(() => {
                            setPhase('exhale');
                            timer = setTimeout(() => {
                                runCycle();
                            }, 4000); // 4s Exhale
                        }, 4000); // 4s Inhale
                    };
                    runCycle();
                } else {
                    setPhase('ready');
                    clearTimeout(timer);
                }
                return () => clearTimeout(timer);
            }, [isActive]);

            return (
                <div className="fixed inset-0 z-[100] bg-gradient-to-b from-teal-900 to-slate-900 flex flex-col items-center justify-center text-white overflow-hidden animate-fadeIn">
                    
                    {/* Background Ambient Light */}
                    <div className="absolute w-[500px] h-[500px] bg-teal-500/20 rounded-full blur-[100px] animate-pulse"></div>

                    <div className="relative z-10 flex flex-col items-center">
                        <h2 className="text-2xl font-light mb-12 tracking-wide text-teal-100 opacity-90">تمرکز و آرامش</h2>
                        
                        {/* Breathing Circle Container */}
                        <div className="relative w-72 h-72 flex items-center justify-center">
                            {/* Expanding Outer Glow */}
                            <div 
                                className="absolute w-full h-full rounded-full bg-teal-400/30 blur-xl transition-all duration-[4000ms] ease-in-out"
                                style={{ 
                                    transform: phase === 'inhale' ? 'scale(1.5)' : 'scale(1)',
                                    opacity: phase === 'inhale' ? 0.6 : 0.2
                                }}
                            ></div>

                            {/* Main Circle */}
                            <div 
                                className="w-48 h-48 rounded-full border-2 border-teal-200/50 flex items-center justify-center backdrop-blur-sm bg-white/5 transition-all duration-[4000ms] ease-in-out relative z-20 shadow-2xl shadow-teal-500/20"
                                style={{ 
                                    transform: phase === 'inhale' ? 'scale(1.2)' : 'scale(1)' 
                                }}
                            >
                                <div className="text-center transition-opacity duration-500">
                                    <span className="block text-4xl font-bold mb-2 text-white">
                                        {phase === 'inhale' ? 'دم' : phase === 'exhale' ? 'بازدم' : 'آماده'}
                                    </span>
                                    <span className="block text-xs uppercase tracking-[0.2em] text-teal-200 opacity-70 font-mono">
                                        {phase === 'inhale' ? 'Inhale' : phase === 'exhale' ? 'Exhale' : 'Ready'}
                                    </span>
                                </div>
                            </div>
                        </div>

                        {/* Controls */}
                        <div className="mt-16 flex flex-col gap-4 items-center">
                            <button 
                                onClick={() => setIsActive(!isActive)}
                                className={`px-8 py-3 rounded-full min-w-[160px] font-bold transition-all duration-300 shadow-lg ${
                                    isActive 
                                    ? 'bg-slate-700/50 text-slate-300 hover:bg-slate-700' 
                                    : 'bg-teal-500 hover:bg-teal-400 text-white hover:shadow-teal-500/50'
                                }`}
                            >
                                {isActive ? 'توقف' : 'شروع تمرین'}
                            </button>
                            
                            <button 
                                onClick={onClose}
                                className="text-sm text-slate-400 hover:text-white transition-colors mt-2"
                            >
                                بازگشت به داشبورد
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('proposal');
            const [mobileOpen, setMobileOpen] = useState(false);
            const [zenMode, setZenMode] = useState(false);

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans selection:bg-emerald-200 selection:text-emerald-900">
                    
                    {/* Mobile Header */}
                    <header className="lg:hidden bg-white/80 backdrop-blur-md border-b border-slate-200 p-4 sticky top-0 z-30 flex items-center justify-between shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-8 h-8 bg-emerald-100 text-emerald-700 rounded-lg flex items-center justify-center">
                                <Icon name="graduation-cap" className="w-5 h-5" />
                            </div>
                            <span className="font-bold text-slate-800">DefaYar</span>
                        </div>
                        <button onClick={() => setMobileOpen(true)} className="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors">
                            <Icon name="menu" className="w-6 h-6" />
                        </button>
                    </header>

                    {/* Mobile Overlay */}
                    {mobileOpen && (
                        <div 
                            className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden animate-fadeIn"
                            onClick={() => setMobileOpen(false)}
                        />
                    )}

                    {/* Sidebar */}
                    <aside className={`fixed top-0 right-0 h-full w-72 bg-white border-l border-slate-200 z-50 transition-transform duration-300 ease-out lg:translate-x-0 flex flex-col shadow-2xl lg:shadow-none ${mobileOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                        {/* Sidebar Header */}
                        <div className="p-6 flex items-center justify-between border-b border-slate-50">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-br from-emerald-500 to-emerald-700 text-white rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/30">
                                    <Icon name="shield-check" className="w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="font-bold text-xl text-slate-800 tracking-tight font-sans">DefaYar</h1>
                                    <p className="text-xs text-emerald-600 font-medium font-mono">@healthcono</p>
                                </div>
                            </div>
                            <button onClick={() => setMobileOpen(false)} className="lg:hidden text-slate-400 hover:text-red-500 transition-colors">
                                <Icon name="x" className="w-6 h-6" />
                            </button>
                        </div>

                        {/* Navigation */}
                        <nav className="flex-1 overflow-y-auto py-6 px-4 space-y-1">
                            {Object.entries(SECTIONS).map(([key, data]) => (
                                <button
                                    key={key}
                                    onClick={() => {
                                        setActiveTab(key);
                                        setMobileOpen(false);
                                    }}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 group ${
                                        activeTab === key 
                                        ? 'bg-emerald-50 text-emerald-700 font-bold shadow-sm ring-1 ring-emerald-100' 
                                        : 'text-slate-500 hover:bg-slate-50 hover:text-slate-900'
                                    }`}
                                >
                                    <span className={`transition-colors ${activeTab === key ? 'text-emerald-600' : 'text-slate-400 group-hover:text-slate-600'}`}>
                                        <Icon name={data.icon} className="w-5 h-5" />
                                    </span>
                                    <span className="flex-1 text-right">{data.title}</span>
                                    {activeTab === key && <div className="w-1.5 h-1.5 rounded-full bg-emerald-500"></div>}
                                </button>
                            ))}
                        </nav>

                        {/* Footer / Developer Info */}
                        <div className="p-4 border-t border-slate-100 bg-slate-50/50">
                            <div className="bg-gradient-to-tr from-emerald-600 to-emerald-500 rounded-2xl p-4 text-white shadow-lg shadow-emerald-500/20 relative overflow-hidden group cursor-default">
                                <div className="absolute -right-6 -top-6 w-20 h-20 bg-white/20 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                                <div className="absolute -left-6 -bottom-6 w-20 h-20 bg-emerald-800/20 rounded-full blur-2xl"></div>
                                
                                <div className="relative z-10 flex flex-col gap-3">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-full bg-white/20 border border-white/30 flex items-center justify-center shrink-0">
                                            <Icon name="code-2" className="w-5 h-5 text-white" />
                                        </div>
                                        <div>
                                            <p className="text-[10px] text-emerald-100 uppercase tracking-widest font-semibold mb-0.5">Developer</p>
                                            <p className="text-sm font-bold leading-tight">Dr. Fatemeh Zarei</p>
                                        </div>
                                    </div>
                                    
                                    <div className="h-px w-full bg-white/20"></div>
                                    
                                    <div className="space-y-1.5">
                                        <a href="mailto:healcono@gmail.com" className="flex items-center gap-2 text-xs text-emerald-50 hover:text-white transition-colors">
                                            <Icon name="mail" className="w-3 h-3 opacity-70" />
                                            <span className="font-mono tracking-tight">healcono@gmail.com</span>
                                        </a>
                                        <div className="flex items-center gap-2 text-xs text-emerald-50">
                                             <Icon name="instagram" className="w-3 h-3 opacity-70" />
                                            <span className="font-mono">@healthcono</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="lg:mr-72 min-h-screen transition-all duration-300 p-4 lg:p-8">
                        <div className="max-w-5xl mx-auto">
                            {/* Page Header */}
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                                <div>
                                    <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2">
                                        {SECTIONS[activeTab].title}
                                    </h2>
                                    <p className="text-slate-500 text-sm mt-1">دستیار هوشمند موفقیت تحصیلی شما</p>
                                </div>
                                <button 
                                    onClick={() => setZenMode(true)}
                                    className="flex items-center gap-2 bg-white hover:bg-emerald-50 border border-slate-200 hover:border-emerald-200 text-slate-600 hover:text-emerald-700 px-4 py-2 rounded-xl transition-all shadow-sm group"
                                >
                                    <Icon name="flower-2" className="w-5 h-5 group-hover:rotate-45 transition-transform" />
                                    <span className="font-medium">حالت تمرکز (Zen)</span>
                                </button>
                            </div>

                            {/* Content Render */}
                            {SECTIONS[activeTab].content}
                        </div>
                    </main>

                    {/* Zen Mode Overlay */}
                    {zenMode && <ZenMode onClose={() => setZenMode(false)} />}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
