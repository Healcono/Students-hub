    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .checkbox-wrapper input:checked + div {
            background-color: #059669;
            border-color: #059669;
        }
        /* Custom Checkbox for Etiquette Tab (Gold) */
        .checkbox-wrapper.gold input:checked + div {
            background-color: #f59e0b;
            border-color: #f59e0b;
        }

        .checkbox-wrapper input:checked + div svg {
            display: block;
        }

        /* Accordion transition */
        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 500px; /* Arbitrary large number */
            opacity: 1;
        }
        .accordion-icon {
            transition: transform 0.3s ease;
        }
        .accordion-btn[aria-expanded="true"] .accordion-icon {
            transform: rotate(180deg);
        }
        
        /* Star Animation */
        .star-icon { transition: all 0.2s ease; }
        .star-icon.active { fill: #fbbf24; color: #fbbf24; transform: scale(1.1); }

        /* Paper texture for templates */
        .paper-texture {
            background-color: #fffdf5;
            background-image: linear-gradient(#f1f5f9 1px, transparent 1px);
            background-size: 100% 2rem;
            line-height: 2rem;
        }
        
        /* Circular Progress */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        input[type=range] {
            -webkit-appearance: none; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
        }
        input[type=range]:focus {
            outline: none; 
        }

        /* Breathing Animation */
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0.4; }
        }
        .breathing-circle {
            animation: breathe 4s infinite ease-in-out;
        }
    </style>
</head>
